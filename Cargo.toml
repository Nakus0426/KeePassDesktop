[workspace]
resolver = "3"
members = [
    "crates/keepass-core",
    "crates/vault-model",
    "crates/design-system",
    "crates/platform-api",
    "crates/platform-win",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Nakus0426/KeePassDesktop"

[workspace.dependencies]
# GPUI stack. Consumed only through `design-system`; no other crate names it.
# default-features = false deliberately drops `component` and `assets`:
# Q14=B says gpui-base is the base and gpui-component is an opt-in escape hatch.
gpui-kit = { version = "0.8.0", default-features = false }

# Vault / crypto
keepass = { version = "0.17.0", features = ["save_kdbx4", "totp"] }
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
sha2 = "0.10"
subtle = "2"
rand = "0.9"

# Common
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
